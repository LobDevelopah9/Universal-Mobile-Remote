# XcodeGen spec. Generate the project with:  xcodegen generate
name: Remote

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Your Apple Developer team (Xcode → Settings → Accounts). Empty builds for the simulator only.
    DEVELOPMENT_TEAM: ""
    # Set to YES only after Apple grants com.apple.developer.networking.multicast,
    # and also switch REMOTE_ENTITLEMENTS to Config/Remote-Multicast.entitlements.
    ENABLE_MULTICAST: "NO"
    REMOTE_ENTITLEMENTS: Config/Remote.entitlements

packages:
  RemoteKit:
    path: Packages/RemoteKit

targets:
  Remote:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remote
        PRODUCT_NAME: Remote
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: $(REMOTE_ENTITLEMENTS)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - package: RemoteKit
        product: RemoteCore
      - package: RemoteKit
        product: RemoteDiscovery
      - package: RemoteKit
        product: RemoteStorage
      - package: RemoteKit
        product: RemoteDrivers

  RemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.remote.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Remote

schemes:
  Remote:
    build:
      targets:
        Remote: all
        RemoteTests: [test]
    run:
      config: Debug
      commandLineArguments:
        "-mockTV": false
    test:
      config: Debug
      targets:
        - RemoteTests
